version: '3.8'

services:
  sync-service:
    build: .
    container_name: sync-mantenimientos-service
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=Sync Mantenimientos Service
      - SERVICE_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=true
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - crac-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  crac-network:
    driver: bridge
